[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schemaorg"
version = "30.1"
description = "Schema.org software stack"
readme = "SOFTWARE_README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "autopep8>=2.3.2",
    "beautifulsoup4>=4.14.3",
    "colorama>=0.4.6",
    "Flask>=3.1.3",
    "Jinja2>=3.1.6",
    "markdown2>=2.5.5",
    "Pygments>=2.19.2",
    "pyprojroot>=0.3.0",
    "pyshacl>=0.31.0",
    "rdflib>=7.6.0",
    "requests>=2.32.5",
    "six>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]

[project.scripts]
build_site = "scripts.buildsite:main"
build_schema = "scripts.buildfiles:main"
build_term_list = "scripts.buildtermlist:main"
reorg = "scripts.reorg:main"
run_tests = "scripts.runtests:main"
dev_server = "scripts.devserv:main"

[tool.setuptools]
packages = { find = { where = ["."], include = ["*"] } }
