# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. 
on:
  # Triggers the workflow on all pull requests and on pushes to main
  push:
    branches:
      - main
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      # Setup python environment
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      
      # Install python dependencies
      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e software

      # Verify checked-in 'next' release artifacts match current sources
      - name: Verify data/releases/next is up to date
        run: |
          software/scripts/buildfiles.py
          git diff --exit-code data/releases/next/
          test -z "$(git ls-files --others --exclude-standard data/releases/next/)"

      # Run unit tests and SHACL example validation
      - name: Run local tests and SHACL validation
        run: |
          software/scripts/runtests.py
          software/scripts/validate_examples_shacl.py
